name: webauthn-fix-temp

on:
  push:
    branches: [feat/webauthn-biometric]
    paths:
      - .github/workflows/webauthn-fix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WebAuthn user id buffer type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/webauthn.ts')
          s = p.read_text()
          old = '''function webauthnUserId(staffId: string): { bytes: Uint8Array; encoded: string } {
            const bytes = createHash("sha256")
              .update(`relife-webauthn-user:${staffId.trim()}`)
              .digest();
            return { bytes, encoded: Buffer.from(bytes).toString("base64url") };
          }'''.replace('          ', '')
          new = '''function webauthnUserId(staffId: string): { bytes: Uint8Array<ArrayBuffer>; encoded: string } {
            const digest = createHash("sha256")
              .update(`relife-webauthn-user:${staffId.trim()}`)
              .digest();
            const bytes = new Uint8Array(Array.from(digest));
            return { bytes, encoded: Buffer.from(bytes).toString("base64url") };
          }'''.replace('          ', '')
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/webauthn.ts
          git commit -m "Fix WebAuthn ArrayBuffer typing"
          git push
