name: webauthn-lock-temp

on:
  push:
    branches: [feat/webauthn-biometric]
    paths:
      - package.json

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: webauthn-package-lock
          path: package-lock.json
