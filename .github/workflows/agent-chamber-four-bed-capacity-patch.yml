name: Agent Chamber four-bed patch

on:
  push:
    branches:
      - agent/chamber-four-bed-capacity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chamber-four-bed-capacity
          fetch-depth: 0

      - name: Apply reviewed Chamber rule patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Appointment picker: exact clinic hours, shared with Chamber board.
          replace(
              "components/AppointmentFormMultiDate.tsx",
              'import { haptic } from "@/lib/interactions";\n',
              'import { haptic } from "@/lib/interactions";\nimport { PHYSIO_CHAMBER_STARTS } from "@/lib/domain/chamber/hours";\n',
          )
          replace(
              "components/AppointmentFormMultiDate.tsx",
              '''const PHYSIO_TIME_SLOTS = [\n  "09:00",\n  "10:00",\n  "11:00",\n  "12:00",\n  "13:00",\n  "14:00",\n  "15:00",\n  "16:00",\n  "17:00",\n];''',
              'const PHYSIO_TIME_SLOTS = [...PHYSIO_CHAMBER_STARTS];',
          )
          replace(
              "components/AppointmentFormMultiDate.tsx",
              'if (result.error === "INVALID_SLOT") return "Physio appointment শুধু পূর্ণ ঘণ্টায় বুক করা যাবে।";',
              'if (result.error === "INVALID_SLOT") return "Physio booking 9 AM–1 PM ও 3–9 PM-এর hourly slot-এ করা যাবে।";',
          )
          replace(
              "components/AppointmentFormMultiDate.tsx",
              'Physio Chamber uses fixed 60-minute slots.',
              '60-minute slots · 9 AM–1 PM & 3–9 PM · 4 beds.',
          )

          # Live Chamber: Traction is not a fifth patient bed.
          replace(
              "components/ChamberHourlyBedBoard.tsx",
              'const TRACTION = { id: "TRACTION-BED" as BedId, label: "Traction", room: "Traction Room" };\n',
              '',
          )
          replace(
              "components/ChamberHourlyBedBoard.tsx",
              '<div className="grid grid-cols-2 gap-2">{BEDS.map((bed) => renderBedCell(bed, slot))}</div><div className="mt-2">{renderBedCell(TRACTION, slot)}</div>{renderExpanded(slot)}',
              '<div className="grid grid-cols-2 gap-2">{BEDS.map((bed) => renderBedCell(bed, slot))}</div>{renderExpanded(slot)}',
          )

          replace(
              "app/(dashboard)/chamber/page.tsx",
              'One hour · Bed 1–4 + Traction · book in place',
              '10 hourly slots · Bed 1–4 · max 40 patients/day',
          )

          # Canonical scheduling: all patients, including traction plans, occupy one of Bed 1–4.
          replace(
              "lib/webos/appointmentScheduling.ts",
              'import type { PatientRecord } from "@/lib/patients";\n',
              'import type { PatientRecord } from "@/lib/patients";\nimport { PHYSIO_CHAMBER_STARTS, chamberStartMinutes, isPhysioChamberStart } from "@/lib/domain/chamber/hours";\n',
          )
          replace(
              "lib/webos/appointmentScheduling.ts",
              '  const endMinute = startMinute + durationMin;\n',
              '  const endMinute = startMinute + Math.max(60, durationMin);\n',
          )
          replace(
              "lib/webos/appointmentScheduling.ts",
              '    return overlaps(startMinute, endMinute, existingStart, existingStart + item.expectedDurationMin);',
              '    return overlaps(startMinute, endMinute, existingStart, existingStart + Math.max(60, item.expectedDurationMin));',
          )
          replace(
              "lib/webos/appointmentScheduling.ts",
              '''\n  if (needsTraction) {\n    const busy = overlappingAppointments.find((item) => item.assignedBedId === "TRACTION-BED");\n    if (busy) {\n      return {\n        bedId: "",\n        roomId: "Traction Room",\n        station: "Traction",\n        conflict: { type: "no_bed", message: `Traction Bed busy with ${busy.patientName || busy.patientId}` },\n      };\n    }\n    return { bedId: "TRACTION-BED", roomId: "Traction Room", station: "Traction" };\n  }\n''',
              '\n',
          )
          replace(
              "lib/webos/appointmentScheduling.ts",
              '''  if (!gender) {\n    return {\n      bedId: "",\n      roomId: "",\n      station: "",\n      conflict: { type: "gender_required", message: "Patient gender must be set before Physio bed booking." },\n    };\n  }\n\n  const occupiedBeds = new Set<string>();''',
              '''  if (!gender) {\n    return {\n      bedId: "",\n      roomId: "",\n      station: "",\n      conflict: { type: "gender_required", message: "Patient gender must be set before Physio bed booking." },\n    };\n  }\n\n  if (overlappingAppointments.length >= 4) {\n    return {\n      bedId: "",\n      roomId: "",\n      station: "",\n      conflict: { type: "no_bed", message: "All 4 treatment beds are already booked for this hour." },\n    };\n  }\n\n  const occupiedBeds = new Set<string>();''',
          )
          replace(
              "lib/webos/appointmentScheduling.ts",
              '      if (!occupiedBeds.has(bedId)) return { bedId, roomId, station: "Treatment" };',
              '      if (!occupiedBeds.has(bedId)) return { bedId, roomId, station: needsTraction ? "Traction" : "Treatment" };',
          )

          # Domain-level time guard, so no direct caller can bypass clinic hours.
          replace(
              "lib/webos/appointmentScheduling.ts",
              '  const startMinute = timeInputMinutes(input.time);\n  const state = await loadState();',
              '  if (!isPhysioChamberStart(input.time)) throw new Error("INVALID_SLOT");\n  const startMinute = timeInputMinutes(input.time);\n  const state = await loadState();',
          )

          old_suggestions = '''function suggestionsFor(\n  state: SchedulingState,\n  patient: PatientRecord,\n  date: string,\n  requestedStart: number,\n  selectedModalities: string[],\n  needsTraction: boolean\n): BookingSuggestion[] {\n  const suggestions: BookingSuggestion[] = [];\n  for (let candidate = requestedStart + 5; candidate < 24 * 60 && candidate <= requestedStart + 240; candidate += 5) {\n    const result = evaluateAt(state, patient, date, candidate, selectedModalities, needsTraction);\n    if (!result.isValid || !result.assignedBedId) continue;\n    suggestions.push({\n      time: inputTimeFromMinutes(candidate),\n      timeLabel: sheetTimeFromMinutes(candidate),\n      assignedBedId: result.assignedBedId,\n      roomId: result.roomId,\n      totalDurationMin: result.totalDurationMin,\n      reason: "Gender-safe bed and selected machines are available.",\n    });\n    if (suggestions.length >= 4) break;\n  }\n  return suggestions;\n}'''
          new_suggestions = '''function suggestionsFor(\n  state: SchedulingState,\n  patient: PatientRecord,\n  date: string,\n  requestedStart: number,\n  selectedModalities: string[],\n  needsTraction: boolean\n): BookingSuggestion[] {\n  const suggestions: BookingSuggestion[] = [];\n  for (const time of PHYSIO_CHAMBER_STARTS) {\n    const candidate = chamberStartMinutes(time);\n    if (candidate <= requestedStart || candidate > requestedStart + 240) continue;\n    const result = evaluateAt(state, patient, date, candidate, selectedModalities, needsTraction);\n    if (!result.isValid || !result.assignedBedId) continue;\n    suggestions.push({\n      time,\n      timeLabel: sheetTimeFromMinutes(candidate),\n      assignedBedId: result.assignedBedId,\n      roomId: result.roomId,\n      totalDurationMin: result.totalDurationMin,\n      reason: "Gender-safe bed and selected machines are available.",\n    });\n    if (suggestions.length >= 4) break;\n  }\n  return suggestions;\n}'''
          replace("lib/webos/appointmentScheduling.ts", old_suggestions, new_suggestions)

          # Remove this one-shot helper workflow from the resulting feature commit.
          Path(".github/workflows/agent-chamber-four-bed-capacity-patch.yml").unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "enforce four-bed Chamber capacity and clinic hours"
          git push origin HEAD:agent/chamber-four-bed-capacity
