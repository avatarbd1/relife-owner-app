name: web-ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_SECRET: ci-session-secret-relife-owner-app-2026
      OWNER_PIN: "000000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: PR impact and user-flow gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/validate-pr-impact.mjs
      - name: Lint
        run: npm run lint
      - name: Domain tests
        run: npm run test
      - name: Build
        run: npm run build
